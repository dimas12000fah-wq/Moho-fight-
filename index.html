<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MOHO FIGHT</title>
 <style>

.fighter.surat{
  width:150px;
  height:180px;
  background-image:url('file_00000000eac081f5a229e563fef2f17f.png');
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center bottom;
}

.fighter.surat .head,
.fighter.surat .body,
.fighter.surat .leg{
  display:none;
}

*{
  box-sizing:border-box;
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

body{
 margin:0;
 background:#090b12;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
 touch-action:none;
}

button{
 border:0;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

.screen{
 width:100vw;
 height:100vh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
}

.hidden{display:none!important}

/* MENU */
#menu{
 background:
 radial-gradient(circle at 50% 35%,#263a70 0,#10152c 35%,#05060a 80%);
}

.logo{
 font-size:52px;
 font-weight:1000;
 color:#ffd21c;
 text-shadow:4px 5px 0 #d71919,0 0 25px #ff7b00;
 margin-bottom:10px;
}

.sub{
 color:#ddd;
 margin-bottom:35px;
}

.menuBtn{
 width:260px;
 padding:17px;
 margin:8px;
 border-radius:14px;
 font-size:19px;
 background:linear-gradient(#e52d27,#9d1010);
 box-shadow:0 5px 0 #500;
}

/* SELECT */
#select{
 justify-content:flex-start;
 padding-top:20px;
 background:#101522;
 overflow:auto;
}

.title{
 font-size:30px;
 font-weight:900;
 color:#ffd21c;
 margin:10px;
}

.roster{
 width:95%;
 max-width:700px;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 padding-bottom:130px;
}

.char{
 background:#20283b;
 border:2px solid #3d4a68;
 border-radius:12px;
 padding:10px 4px;
 min-height:85px;
}

.char.active{
 border-color:#ffd21c;
 background:#51410d;
 box-shadow:0 0 15px #ffd21c;
}

.face{
 width:42px;
 height:42px;
 margin:auto;
 border-radius:50%;
 background:#e3a66b;
 border:3px solid #111;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:20px;
}

.charName{
 margin-top:5px;
 font-size:13px;
 font-weight:bold;
}

.start{
 position:fixed;
 bottom:15px;
 width:250px;
 padding:16px;
 border-radius:15px;
 background:#18a83b;
 font-size:19px;
 box-shadow:0 5px 0 #07551c;
}

/* GAME */
#game{
 position:relative;
 background:
 linear-gradient(#172d55 0 55%,#35452d 55% 75%,#171717 75%);
}

#game:after{
 content:"";
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 height:25%;
 background:repeating-linear-gradient(
  90deg,#252525 0,#252525 45px,#303030 46px,#303030 90px
 );
}

.hud{
 position:absolute;
 top:10px;
 left:10px;
 right:10px;
 z-index:10;
}

.names{
 display:flex;
 justify-content:space-between;
 font-weight:bold;
 margin-bottom:5px;
}

.bars{
 display:flex;
 gap:8px;
}

.bar{
 flex:1;
 height:23px;
 border:3px solid #111;
 background:#333;
 border-radius:8px;
 overflow:hidden;
}

.hp{
 height:100%;
 background:linear-gradient(#55ff63,#079a20);
 width:100%;
 transition:.2s;
}

#hp2{
 background:linear-gradient(#ff5959,#b00000);
}

#timer{
 text-align:center;
 font-size:30px;
 font-weight:1000;
 text-shadow:2px 2px #000;
 margin-top:-26px;
}

#round{
 text-align:center;
 font-size:15px;
 margin-top:4px;
}

.arena{
 position:absolute;
 left:0;
 right:0;
 bottom:25%;
 height:50%;
}

.fighter{
 position:absolute;
 bottom:0;
 width:82px;
 height:130px;
 transition:transform .08s;
}

.body{
 position:absolute;
 bottom:15px;
 left:20px;
 width:45px;
 height:70px;
 background:#1976d2;
 border-radius:15px 15px 8px 8px;
 border:3px solid #111;
}

.fighter.enemy .body{
 background:#c62828;
}

.head{
 position:absolute;
 top:0;
 left:17px;
 width:50px;
 height:50px;
 border-radius:50%;
 background:#d99a62;
 border:3px solid #111;
}

.eye{
 position:absolute;
 width:6px;
 height:6px;
 background:#111;
 border-radius:50%;
 top:20px;
}

.eye.left{left:13px}
.eye.right{right:13px}

.leg{
 position:absolute;
 bottom:0;
 width:13px;
 height:28px;
 background:#111;
}

.leg.l{left:24px}
.leg.r{right:18px}

#p1{left:18%}
#p2{right:18%}

#message{
 position:absolute;
 top:40%;
 left:0;
 right:0;
 text-align:center;
 font-size:42px;
 font-weight:1000;
 color:#ffd21c;
 text-shadow:3px 3px #000;
 z-index:20;
}

.controls{
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 height:25%;
 z-index:30;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px;
}

.move{
 display:flex;
 gap:8px;
}

.ctrl{
 width:58px;
 height:58px;
 border-radius:50%;
 background:#333b;
 border:2px solid #aaa;
 font-size:24px;
}

.attacks{
 display:flex;
 gap:8px;
 align-items:end;
}

.attack{
 width:70px;
 height:70px;
 border-radius:50%;
 font-size:12px;
 background:#d62929;
 border:3px solid #ff9a9a;
}

.skill1{background:#1769e0}
.skill2{background:#8b21cf}

.back{
 position:absolute;
 top:10px;
 left:10px;
 z-index:50;
 background:#333c;
 border-radius:10px;
 padding:9px 13px;
}

@media(max-height:600px){
 .fighter{transform:scale(.8);transform-origin:bottom}
 .controls{height:27%}
 .arena{bottom:27%;height:48%}
}
</style>
</head>

<body>

<!-- MENU -->
<section id="menu" class="screen">
 <div class="logo">MOHO FIGHT</div>
 <div class="sub">KAMPUNG FIGHTING CHAMPIONSHIP</div>

 <button class="menuBtn" onclick="showSelect()">⚔️ MULAI FIGHT</button>
 <button class="menuBtn" onclick="showRoster()">👊 DAFTAR PETARUNG</button>
</section>

<!-- SELECT -->
<section id="select" class="screen hidden">
 <div class="title">PILIH PETARUNG</div>
 <div id="roster" class="roster"></div>
 <button class="start" onclick="startGame()">MULAI PERTARUNGAN</button>
</section>

<!-- GAME -->
<section id="game" class="screen hidden">

 <button class="back" onclick="backMenu()">← MENU</button>

 <div class="hud">
   <div class="names">
     <span id="name1">SURAT</span>
     <span id="name2">LAWAN</span>
   </div>

   <div class="bars">
     <div class="bar"><div id="hp1" class="hp"></div></div>
     <div class="bar"><div id="hp2" class="hp"></div></div>
   </div>

   <div id="timer">60</div>
   <div id="round">ROUND 1</div>
 </div>

 <div id="message"></div>

 <div class="arena">

   <div id="p1" class="fighter">
     <div class="head">
       <div class="eye left"></div>
       <div class="eye right"></div>
     </div>
     <div class="body"></div>
     <div class="leg l"></div>
     <div class="leg r"></div>
   </div>

   <div id="p2" class="fighter enemy">
     <div class="head">
       <div class="eye left"></div>
       <div class="eye right"></div>
     </div>
     <div class="body"></div>
     <div class="leg l"></div>
     <div class="leg r"></div>
   </div>

 </div>

 <div class="controls">

   <div class="move">
     <button class="ctrl" ontouchstart="move(-1)">◀</button>
     <button class="ctrl" ontouchstart="jump()">⬆</button>
     <button class="ctrl" ontouchstart="move(1)">▶</button>
   </div>

   <div class="attacks">
     <button class="attack" ontouchstart="punch()">PUNCH</button>
     <button class="attack skill1" ontouchstart="skill(1)">SKILL 1</button>
     <button class="attack skill2" ontouchstart="skill(2)">SKILL 2</button>
   </div>

 </div>
</section>

<script>

const chars=[
 ["Surat","📜","Surat Terbang","Hujan Surat"],
 ["Sargen","🍢","Sempol Ayam","Sempol Ganas"],
 ["Saragih","🔱","Tombak Tusuk","Tombak Putar"],
 ["Gawel","🍈","Jambu Lempar","Hujan Jambu"],
 ["Ucok","🫗","Minyak Panas","Banjir Minyak"],
 ["Evan","🥋","Sabuk Pukul","Tali Pinggang"],
 ["Bendol","🔨","Palu Hantam","Palu Meteor"],
 ["Supri","🐄","Serudukan Sapi","Amukan Sapi"],
 ["Jumalik","☕","Kopi Panas","Kopi Meledak"],
 ["Nando","🥣","Bubur Lempar","Bubur Banjir"],
 ["Rian","🌴","Buah Sawit","Hujan Sawit"],
 ["Kumis","🗡️","Parang Tebas","Parang Berputar"],
 ["Brewok","🏍️","Motor Seruduk","Motor Gila"],
 ["Diko","💉","Suntikan","Suntik Racun"],
 ["Opeh","🐟","Lele Lempar","Lele Ganas"],
 ["Bancek","⚡","Setrum PLN","Petir PLN"],
 ["Benjo","🐍","Ular Serang","Raja Ular"],
 ["Ijol","🐻","Cakar Beruang","Beruang Mengamuk"],
 ["Reza","🏐","Smash Bola","Bola Petir"],
 ["Feri","🔥","Las Panas","Laser Las"],
 ["Leman","💰","Duit Lempar","Hujan Duit"],
 ["Kancel","🥷","Ninja Sawit","Bayangan Sawit"],
 ["Uceha","💵","Dana Serang","Dana Cair"],
 ["Wisnu","☠️","Pupuk Racun","Ledakan Pupuk"],
 ["Suriono","⛺","Segel Teratak","Teratak Jatuh"],
 ["Sugi","🎣","Kail Tarik","Kail Raksasa"],
 ["Niko","🌀","Rambut Pukul","Rambut Tornado"],
 ["Rianto","🪚","Sinso Tebas","Sinso Gergaji"],
 ["Babok","🧚","Pemikat Wanita","Bidadari Serang"],
 ["Situk","🥥","Kelapa Lempar","Hujan Kelapa"],
 ["Amad","🥤","Dawet Lempar","Banjir Dawet"]
];

let selected=0;
let hp1=100;
let hp2=100;
let time=60;
let timer;
let enemyTimer;
let x1=18;
let x2=75;
let jumping=false;
let gameOver=false;

const roster=document.getElementById("roster");

function buildRoster(){

 roster.innerHTML="";

 chars.forEach((c,i)=>{

  let d=document.createElement("button");
  d.className="char"+(i===selected?" active":"");

  d.innerHTML=
   '<div class="face">'+c[1]+'</div>'+
   '<div class="charName">'+c[0]+'</div>';

  d.onclick=()=>{
   selected=i;
   buildRoster();
  };

  roster.appendChild(d);
 });
}

function showSelect(){
 document.getElementById("menu").classList.add("hidden");
 document.getElementById("select").classList.remove("hidden");
 buildRoster();
}

function showRoster(){
 showSelect();
}

function startGame(){

 document.getElementById("select").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 hp1=100;
 hp2=100;
 time=60;
 x1=18;
 x2=75;
 gameOver=false;

 document.getElementById("name1").textContent=chars[selected][0].toUpperCase();
 document.getElementById("name2").textContent="LAWAN";

 update();

 document.getElementById("message").textContent="FIGHT!";

 setTimeout(()=>{
  document.getElementById("message").textContent="";
 },1000);

 clearInterval(timer);
 clearInterval(enemyTimer);

 timer=setInterval(()=>{
  if(gameOver)return;

  time--;

  document.getElementById("timer").textContent=time;

  if(time<=0){
   endFight();
  }

 },1000);

 enemyTimer=setInterval(enemyAttack,1400);

}

function update(){

 document.getElementById("hp1").style.width=hp1+"%";
 document.getElementById("hp2").style.width=hp2+"%";

 document.getElementById("p1").style.left=x1+"%";
 document.getElementById("p2").style.left=x2+"%";
}

function move(dir){

 if(gameOver)return;

 x1+=dir*3;

 if(x1<2)x1=2;
 if(x1>88)x1=88;

 update();
}

function jump(){

 if(jumping||gameOver)return;

 jumping=true;

 let p=document.getElementById("p1");

 p.style.bottom="80px";

 setTimeout(()=>{
  p.style.bottom="0";
  jumping=false;
 },350);
}

function punch(){

 if(gameOver)return;

 attackAnimation();

 let distance=Math.abs(x1-x2);

 if(distance<18){

  hp2-=8;

  if(hp2<0)hp2=0;

  hitEffect("p2");

  update();

  checkWin();
 }
}

function skill(n){

 if(gameOver)return;

 let distance=Math.abs(x1-x2);

 if(distance<35){

  let damage=n===1?16:25;

  hp2-=damage;

  if(hp2<0)hp2=0;

  document.getElementById("message").textContent=
   chars[selected][n+1].toUpperCase();

  hitEffect("p2");

  setTimeout(()=>{
   if(!gameOver)
    document.getElementById("message").textContent="";
  },500);

  update();

  checkWin();

 }else{

  document.getElementById("message").textContent="TERLALU JAUH!";

  setTimeout(()=>{
   if(!gameOver)
    document.getElementById("message").textContent="";
  },400);
 }
}

function attackAnimation(){

 let p=document.getElementById("p1");

 p.style.transform="scaleX(1.25)";

 setTimeout(()=>{
  p.style.transform="scaleX(1)";
 },120);
}

function hitEffect(id){

 let p=document.getElementById(id);

 p.style.transform="translateX(15px) rotate(8deg)";

 setTimeout(()=>{
  p.style.transform="translateX(0) rotate(0)";
 },120);
}

function enemyAttack(){

 if(gameOver)return;

 let distance=Math.abs(x1-x2);

 if(distance<20){

  hp1-=Math.floor(Math.random()*7)+5;

  if(hp1<0)hp1=0;

  hitEffect("p1");

  update();

  checkWin();

 }else{

  if(x2>x1)x2-=2;
  else x2+=2;

  update();
 }
}

function checkWin(){

 if(hp2<=0){

  endFight(chars[selected][0].toUpperCase()+" MENANG!");

 }

 if(hp1<=0){

  endFight("LAWAN MENANG!");

 }
}

function endFight(text){

 if(gameOver)return;

 gameOver=true;

 clearInterval(timer);
 clearInterval(enemyTimer);

 document.getElementById("message").textContent=text;

}

function backMenu(){

 clearInterval(timer);
 clearInterval(enemyTimer);

 gameOver=true;

 document.getElementById("game").classList.add("hidden");
 document.getElementById("select").classList.add("hidden");
 document.getElementById("menu").classList.remove("hidden");
}

</script>

</body>
  </html>
