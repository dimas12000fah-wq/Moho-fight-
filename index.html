<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MOHO FIGHT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #111; color: white; overflow: hidden; touch-action: none; }
        
        #menu { padding: 20px; text-align: center; background: linear-gradient(135deg, #1e3c72, #7e22ce); min-height: 100vh; overflow-y: auto; }
        h1 { font-size: 32px; color: #ffff00; margin-bottom: 20px; text-shadow: 3px 3px #ff00de; }
        .btn { background: #ff00de; color: white; border: 3px solid white; padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 10px; }
        .btn:active { background: #00ffff; color: black; }
        
        #charGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; max-width: 600px; margin: 20px auto; }
        .charCard { background: #444; border: 3px solid #666; border-radius: 10px; padding: 10px; cursor: pointer; }
        .charCard.selected { border-color: #ffff00; box-shadow: 0 0 15px #ffff00; }
        .charBox { 
            width: 100%; 
            height: 80px; 
            border-radius: 5px; 
            margin-bottom: 5px; 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .charName { font-size: 11px; font-weight: bold; }
        
        #fightBtn { display: none; background: #ff0000; color: white; border: 4px solid white; padding: 15px 50px; font-size: 24px; cursor: pointer; border-radius: 15px; margin-top: 20px; }
        
        #arena { 
            display: none; 
            width: 100vw; 
            height: 100vh; 
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 50%, #DEB887 50%, #DEB887 100%); 
            position: relative; 
            overflow: hidden;
        }
        
        .hp { 
            position: absolute; 
            top: 10px; 
            width: 40%; 
            max-width: 200px;
            height: 30px; 
            background: #333; 
            border: 3px solid white; 
            border-radius: 10px; 
            overflow: hidden; 
        }
        #p1HP { left: 10px; }
        #p2HP { right: 10px; }
        .hpFill { 
            height: 100%; 
            background: linear-gradient(90deg, #ff0000, #ffff00); 
            width: 100%; 
            transition: width 0.3s; 
        }
        .hpText { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            text-align: center; 
            line-height: 24px; 
            font-size: 14px; 
            font-weight: bold;
            text-shadow: 1px 1px 2px black; 
        }
        
        #timer { 
            position: absolute; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 32px; 
            color: #ffff00; 
            background: #333; 
            padding: 10px 20px; 
            border-radius: 10px; 
            border: 3px solid white;
            font-weight: bold;
        }
        
        /* KARAKTER - TANPA KOTAK, BACKGROUND TRANSPARAN */
        .fighter { 
            position: absolute; 
            bottom: 100px; 
            width: 100px;
            height: 150px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            /* HAPUS BORDER DAN BACKGROUND SOLID */
            border: none;
            background-color: transparent;
            transition: left 0.1s;
            z-index: 10;
        }
        #player1 { left: 100px; }
        #player2 { right: 100px; }
        
        .fighter.attacking { 
            animation: attack 0.3s; 
        }
        @keyframes attack { 
            0% { transform: scale(1) translateX(0); } 
            50% { transform: scale(1.2) translateX(30px); } 
            100% { transform: scale(1) translateX(0); } 
        }
        
        /* TOMBOL KONTROL */
        .controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        #controlsP1 { left: 10px; }
        #controlsP2 { right: 10px; display: none; }
        
        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.7);
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .ctrl-btn:active { 
            background: rgba(255,255,255,0.5); 
            transform: scale(0.9); 
        }
        .ctrl-btn.attack { 
            background: rgba(255,0,0,0.7); 
            border-color: #ffff00;
        }
        
        .ctrl-row { display: flex; gap: 10px; align-items: center; }
        
        #gameOver { 
            display: none; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.95); 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            border: 5px solid #ffff00; 
            z-index: 200; 
        }
        #winnerText { font-size: 28px; color: #ffff00; margin-bottom: 20px; font-weight: bold; }
        #gameOver button { padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 5px; border-radius: 10px; border: none; background: #00ffff; }
        
        .skillText { 
            position: absolute; 
            font-size: 24px; 
            font-weight: bold; 
            color: #ffff00; 
            text-shadow: 2px 2px 4px black, -2px -2px 4px black; 
            animation: popup 1s; 
            pointer-events: none; 
            z-index: 50;
        }
        @keyframes popup { 
            0% { transform: translateY(0) scale(0.5); opacity: 0; } 
            50% { transform: translateY(-50px) scale(1.5); opacity: 1; } 
            100% { transform: translateY(-100px) scale(1); opacity: 0; } 
        }
        
        #info { margin: 15px; font-size: 16px; min-height: 30px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>👑 MOHO FIGHT 👑</h1>
        <p style="margin-bottom: 15px; color: #00ffff;">LOCAL HEROES UNLIMITED SKILL</p>
        <button class="btn" onclick="selectMode('1p')">🎮 1 PLAYER (VS CPU)</button>
        <button class="btn" onclick="selectMode('2p')">👥 2 PLAYER</button>
        <div id="charGrid"></div>
        <div id="info"></div>
        <button id="fightBtn" onclick="startFight()">⚔️ FIGHT! ⚔️</button>
    </div>
    
    <div id="arena">
        <div class="hp" id="p1HP">
            <div class="hpFill" id="p1Fill"></div>
            <div class="hpText" id="p1Name">P1</div>
        </div>
        <div id="timer">99</div>
        <div class="hp" id="p2HP">
            <div class="hpFill" id="p2Fill"></div>
            <div class="hpText" id="p2Name">P2</div>
        </div>
        
        <div class="fighter" id="player1"></div>
        <div class="fighter" id="player2"></div>
        
        <div class="controls" id="controlsP1">
            <div class="ctrl-row">
                <div class="ctrl-btn" ontouchstart="moveP1(-20)" onmousedown="moveP1(-20)">⬅️</div>
                <div class="ctrl-btn" ontouchstart="moveP1(20)" onmousedown="moveP1(20)">➡️</div>
                <div class="ctrl-btn attack" ontouchstart="attackP1()" onmousedown="attackP1()">️</div>
            </div>
        </div>
        
        <div class="controls" id="controlsP2">
            <div class="ctrl-row">
                <div class="ctrl-btn" ontouchstart="moveP2(-20)" onmousedown="moveP2(-20)">⬅️</div>
                <div class="ctrl-btn" ontouchstart="moveP2(20)" onmousedown="moveP2(20)">➡️</div>
                <div class="ctrl-btn attack" ontouchstart="attackP2()" onmousedown="attackP2()">⚔️</div>
            </div>
        </div>
        
        <div id="gameOver">
            <h2 id="winnerText"></h2>
            <button class="btn" onclick="location.reload()">🔄 Main Lagi</button>
        </div>
    </div>

    <script>
        const characters = [
            { name: 'GAWEL', color: '#4a90e2', skill: 'JAMBU RAKSASA', damage: 35, image: 'gawel.png' },
            { name: 'SURAT', color: '#ff6b6b', skill: 'SURAT TERBANG', damage: 20, image: 'surat.png' },
            { name: 'SARGEN', color: '#4ecdc4', skill: 'SEMPOL AYAM', damage: 25, image: 'sargen.png' },
            { name: 'UCOK', color: '#fd79a8', skill: 'MINYAK PANAS', damage: 28, image: 'ucok.png' },
            { name: 'BENDOL', color: '#a29bfe', skill: 'PALU RAKSASA', damage: 32, image: 'bendol.png' },
            { name: 'RIAN', color: '#00b894', skill: 'HUJAN SAWIT', damage: 26, image: 'rian.png' },
            { name: 'KUMIS', color: '#e17055', skill: 'SERANGAN KOMBO', damage: 29, image: 'kumis.png' },
            { name: 'BREWOK', color: '#2d3436', skill: 'MOTOR GILA', damage: 30, image: 'brewok png.jpg' },
            { name: 'AMAD', color: '#fdcb6e', skill: 'DAWET RAKSASA', damage: 24, image: 'amad.png' },
            { name: 'FIRMAN', color: '#e74c3c', skill: 'KEKUATAN API', damage: 32, image: 'firman.png' }
        ];
        
        let mode = null, p1 = null, p2 = null, timer = 99, timerInt, active = false;
        let player1 = { x: 100, hp: 100, char: null };
        let player2 = { x: 0, hp: 100, char: null };
        
        function initGrid() {
            const grid = document.getElementById('charGrid');
            characters.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'charCard';
                card.innerHTML = `
                    <div class="charBox" style="background-color: ${c.color}; background-image: url('${c.image}');"></div>
                    <div class="charName">${c.name}</div>
                `;
                card.onclick = () => selectChar(i, card);
                grid.appendChild(card);
            });
        }
        
        function selectMode(m) {
            mode = m;
            p1 = p2 = null;
            document.querySelectorAll('.charCard').forEach(c => c.classList.remove('selected'));
            document.getElementById('info').innerText = '';
            document.getElementById('fightBtn').style.display = 'none';
            document.getElementById('controlsP2').style.display = m === '2p' ? 'flex' : 'none';
            alert('Mode: ' + (m === '1p' ? '1 Player vs CPU' : '2 Player'));
        }
        
        function selectChar(i, card) {
            if (!mode) return alert('Pilih mode (1P/2P) dulu!');
            
            if (!p1) {
                p1 = characters[i];
                card.classList.add('selected');
                
                if (mode === '1p') {
                    let cpuIdx;
                    do {
                        cpuIdx = Math.floor(Math.random() * characters.length);
                    } while (cpuIdx === i);
                    p2 = characters[cpuIdx];
                }
            } else if (!p2 && mode === '2p') {
                p2 = characters[i];
                card.classList.add('selected');
            }
            
            updateInfo();
        }
        
        function updateInfo() {
            let txt = '';
            if (p1) txt += ` P1: ${p1.name}`;
            if (p2) txt += ` | 👤 P2: ${p2.name}`;
            document.getElementById('info').innerText = txt;
            
            if (p1 && p2) {
                document.getElementById('fightBtn').style.display = 'inline-block';
            }
        }
        
        function startFight() {
            if (!p1 || !p2) return alert('Pilih 2 karakter dulu!');
            
            document.getElementById('menu').style.display = 'none';
            document.getElementById('arena').style.display = 'block';
            
            player1.char = p1;
            player2.char = p2;
            
            const p1El = document.getElementById('player1');
            const p2El = document.getElementById('player2');
            
            // Set gambar karakter - TANPA BACKGROUND SOLID
            p1El.style.backgroundImage = `url('${p1.image}')`;
            p1El.style.backgroundColor = 'transparent';
            
            p2El.style.backgroundImage = `url('${p2.image}')`;
            p2El.style.backgroundColor = 'transparent';
            
            document.getElementById('p1Name').innerText = p1.name;
            document.getElementById('p2Name').innerText = p2.name;
            
            player2.x = window.innerWidth - 200;
            
            startGame();
        }
        
        function startGame() {
            active = true;
            timer = 99;
            player1.hp = 100;
            player2.hp = 100;
            player1.x = 100;
            player2.x = window.innerWidth - 200;
            
            updateHP();
            updatePos();
            document.getElementById('timer').innerText = timer;
            document.getElementById('gameOver').style.display = 'none';
            
            timerInt = setInterval(() => {
                if (!active) return;
                timer--;
                document.getElementById('timer').innerText = timer;
                
                if (timer <= 0) {
                    endGame();
                    return;
                }
                
                if (mode === '1p') {
                    cpuAI();
                }
            }, 1000);
            
            gameLoop();
        }
        
        function gameLoop() {
            if (!active) return;
            updatePos();
            requestAnimationFrame(gameLoop);
        }
        
        function updatePos() {
            document.getElementById('player1').style.left = player1.x + 'px';
            document.getElementById('player2').style.left = player2.x + 'px';
        }
        
        function moveP1(delta) {
            if (!active) return;
            const maxX = window.innerWidth - 150;
            player1.x = Math.max(0, Math.min(maxX, player1.x + delta));
        }
        
        function attackP1() {
            if (!active) return;
            performAttack(player1, player2, 'player1');
        }
        
        function moveP2(delta) {
            if (!active) return;
            const maxX = window.innerWidth - 150;
            player2.x = Math.max(0, Math.min(maxX, player2.x + delta));
        }
        
        function attackP2() {
            if (!active) return;
            performAttack(player2, player1, 'player2');
        }
        
        function cpuAI() {
            const dist = Math.abs(player1.x - player2.x);
            
            if (dist > 120) {
                if (player2.x > player1.x) {
                    player2.x = Math.max(0, player2.x - 8);
                } else {
                    player2.x = Math.min(window.innerWidth - 150, player2.x + 8);
                }
            }
            
            if (dist < 120 && Math.random() < 0.3) {
                performAttack(player2, player1, 'player2');
            }
        }
        
        function performAttack(atk, def, atkId) {
            const dist = Math.abs(player1.x - player2.x);
            const atkEl = document.getElementById(atkId);
            
            atkEl.classList.remove('attacking');
            void atkEl.offsetWidth;
            atkEl.classList.add('attacking');
            
            if (dist < 120) {
                showSkill(atk, atk.char.skill + '!');
                
                setTimeout(() => {
                    def.hp = Math.max(0, def.hp - atk.char.damage);
                    updateHP();
                    checkWin();
                }, 150);
            } else {
                showSkill(atk, 'MISS!');
            }
        }
        
        function showSkill(p, txt) {
            const el = document.createElement('div');
            el.className = 'skillText';
            el.innerText = txt;
            
            const x = p === player1 ? player1.x : player2.x;
            el.style.left = x + 'px';
            el.style.bottom = '260px';
            
            document.getElementById('arena').appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }
        
        function updateHP() {
            document.getElementById('p1Fill').style.width = player1.hp + '%';
            document.getElementById('p2Fill').style.width = player2.hp + '%';
        }
        
        function checkWin() {
            if (player1.hp <= 0 || player2.hp <= 0) {
                endGame();
            }
        }
        
        function endGame() {
            active = false;
            clearInterval(timerInt);
            
            let winner = '';
            if (player1.hp <= 0 && player2.hp <= 0) {
                winner = '🤝 SERI!';
            } else if (player1.hp <= 0) {
                winner = `🏆 ${p2.name} MENANG!`;
            } else {
                winner = `🏆 ${p1.name} MENANG!`;
            }
            
            document.getElementById('winnerText').innerText = winner;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        document.addEventListener('keydown', (e) => {
            if (!active || document.getElementById('menu').style.display !== 'none') return;
            
            if (e.key === 'a' || e.key === 'A') moveP1(-20);
            if (e.key === 'd' || e.key === 'D') moveP1(20);
            if (e.key === 's' || e.key === 'S') attackP1();
            
            if (e.key === 'ArrowLeft') moveP2(-20);
            if (e.key === 'ArrowRight') moveP2(20);
            if (e.key === 'ArrowDown') attackP2();
        });
        
        initGrid();
    </script>
</body>
</html>
